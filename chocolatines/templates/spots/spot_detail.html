{% block content %}
<h1>{{spot.name}}</h1>
<p><strong>Description:</strong> {{spot.description}}</p>

{% if spot.image %}
<p><strong>Image:</strong><br><img src="{{ spot.image.url }}" alt="Image of {{ spot.name }}" style="max-width: 200px;"></p>
{% endif %}

<div id="map" style="height: 500px; width: 100%;"></div>

<script>
function initMap() {
    console.log("fetching spot data for map initialization");
    const spot = JSON.parse('{{ spot_json|escapejs }}');

    const center = {
        lat: spot.latitude || 19.4326,
        lng: spot.longitude || -99.1332
    };

    const mapContainer = document.getElementById('map');
    if (!mapContainer) {
        console.error('map container not found');
        return;
    }

    const map = new google.maps.Map(mapContainer, {
        zoom: 12,
        center: center,
        mapId: '{{ MAP_ID }}'
    });

    if (spot.latitude !== null && spot.longitude !== null) {
    
        const content = document.createElement("div");
        content.className = "advanced-marker";
        content.style.background = 'rgba(255,255,255,0.9)';
        content.style.border = '1px solid #333';
        content.style.borderRadius = '8px';
        content.style.padding = '4px 8px';
        content.style.fontWeight = 'bold';
        content.style.fontSize = '12px';
        content.style.color = '#000';

        const label = document.createElement("span");
        label.textContent = spot.name;
        content.appendChild(label);

        const marker = new google.maps.marker.AdvancedMarkerElement({
            map,
            position: { lat: spot.latitude, lng: spot.longitude },
            title: spot.name,
            content: content
        });

        const infowindow = new google.maps.InfoWindow({
            content: `<a href="/spots/${spot.id}/">${spot.name}</a>`
        });

        marker.addEventListener("gmp-click", () => {
            infowindow.open(map, marker);
        });
    }
}
window.initMap = initMap;
</script>


{% endblock %}

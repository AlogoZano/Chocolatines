<h1>{{spot.name}}</h1>
<p><strong>Description:</strong> {{spot.description}}</p>
<p><strong>Score:</strong> {{spot.score}}</p>
<p><strong>Published:</strong> {{spot.is_published|yesno:"Yes,No"}}</p>

{% if spot.image %}
<p><strong>Image:</strong><br><img src="{{ spot.image.url }}" alt="Image of {{ spot.name }}" style="max-width: 200px;"></p>
{% endif %}
